name: Build DEEIX Chat bundle

on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: Repository to clone and build
        required: false
        default: https://github.com/DEEIX-AI/DEEIX-Chat.git
        type: string
      source_ref:
        description: Branch, tag, or commit to build
        required: false
        default: dev
        type: string
      release_tag:
        description: GitHub Release tag; defaults to v{source version}
        required: false
        default: ''
        type: string
  workflow_call:
    inputs:
      source_repository:
        description: Repository to clone and build
        required: false
        type: string
        default: https://github.com/DEEIX-AI/DEEIX-Chat.git
      source_ref:
        description: Branch, tag, or commit to build
        required: false
        type: string
        default: dev
      release_tag:
        description: GitHub Release tag; defaults to v{source version}
        required: false
        type: string
        default: ''
    outputs:
      version:
        description: DEEIX Chat version
        value: ${{ jobs.build.outputs.version }}
      commit:
        description: Built source commit
        value: ${{ jobs.build.outputs.commit }}
      archive:
        description: Generated tar.gz file name
        value: ${{ jobs.build.outputs.archive }}
      sha256:
        description: Generated tar.gz SHA-256
        value: ${{ jobs.build.outputs.sha256 }}
      release_url:
        description: GitHub Release URL
        value: ${{ jobs.build.outputs.release_url }}
      download_url:
        description: Direct GitHub Release asset URL
        value: ${{ jobs.build.outputs.download_url }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      commit: ${{ steps.metadata.outputs.commit }}
      archive: ${{ steps.package.outputs.archive_name }}
      sha256: ${{ steps.package.outputs.sha256 }}
      release_url: ${{ steps.release.outputs.release_url }}
      download_url: ${{ steps.release.outputs.download_url }}
    steps:
      - name: Clone source repository
        id: source
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -Eeuo pipefail
          source_dir="$RUNNER_TEMP/deeix-chat-source"
          rm -rf "$source_dir"
          mkdir -p "$source_dir"
          git -C "$source_dir" init --quiet
          git -C "$source_dir" remote add origin "$SOURCE_REPOSITORY"
          git -C "$source_dir" fetch --depth 1 origin "$SOURCE_REF"
          git -C "$source_dir" checkout --quiet --detach FETCH_HEAD
          echo "path=$source_dir" >> "$GITHUB_OUTPUT"

      - name: Read source metadata
        id: metadata
        shell: bash
        env:
          SOURCE_DIR: ${{ steps.source.outputs.path }}
        run: |
          set -Eeuo pipefail
          version=$(cat "$SOURCE_DIR/VERSION")
          commit=$(git -C "$SOURCE_DIR" rev-parse --short HEAD)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.17.0'
          run_install: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'

      - name: Install native dependency
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libsqlite3-dev

      - name: Make static export compatible
        shell: bash
        env:
          SOURCE_DIR: ${{ steps.source.outputs.path }}
        run: |
          set -Eeuo pipefail
          python3 - "$SOURCE_DIR" <<'PY'
          from pathlib import Path
          import sys, subprocess

          root = Path(sys.argv[1])
          web = root / "apps/web"

          print("=== Debugging apps/web/app structure ===")
          subprocess.run(["ls", "-R", str(web / "app")], check=False)

          # 优先探测新结构下的根页面
          page_candidates = [
              web / "app/(app)/page.tsx",
              web / "app/page.tsx",
              web / "app/(shell)/page.tsx",
              web / "app/(app)/layout.tsx",
          ]

          patched = False
          for page_path in page_candidates:
              if page_path.exists():
                  text = page_path.read_text(encoding="utf-8")
                  if 'redirect("/chat")' in text or ('redirect' in text and 'chat' in text.lower()):
                      page_path.write_text('''"use client";

import { useEffect } from "react";

export default function Page() {
  useEffect(() => {
    window.location.replace("/chat");
  }, []);

  return (
    <main className="flex min-h-svh items-center justify-center">
      <a href="/chat">Open DEEIX Chat</a>
    </main>
  );
}
''', encoding="utf-8")
                      print(f"✓ Patched root redirect page: {page_path.name} at {page_path.relative_to(root)}")
                      patched = True
                      break

          if not patched:
              print("⚠️ Could not find page containing redirect to /chat")

          # next.config.ts（新位置）
          config_path = web / "next.config.ts"
          if config_path.exists():
              config_text = config_path.read_text(encoding="utf-8")
              additions = []
              if "cpus:" not in config_text:
                  additions.append("    cpus: 1,")
              if "memoryBasedWorkersCount:" not in config_text:
                  additions.append("    memoryBasedWorkersCount: false,")
              if "workerThreads:" not in config_text:
                  additions.append("    workerThreads: false,")

              if additions:
                  marker = "useTypeScriptCli: true,"
                  if marker in config_text:
                      config_text = config_text.replace(marker, marker + "\n" + "\n".join(additions) + "\n")
                      config_path.write_text(config_text, encoding="utf-8")
                      print(f"✓ Patched next.config.ts with static export settings")
                  else:
                      print("⚠️ Found next.config.ts but marker not found")
          else:
              print("⚠️ next.config.ts not found at expected location")
          PY

      - name: Install JavaScript dependencies
        shell: bash
        working-directory: ${{ steps.source.outputs.path }}
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        shell: bash
        working-directory: ${{ steps.source.outputs.path }}/apps/web
        env:
          NODE_OPTIONS: --max-old-space-size=1800
          NEXT_TELEMETRY_DISABLED: '1'
          UV_THREADPOOL_SIZE: '1'
        run: |
          set -Eeuo pipefail
          rm -rf .next out
          timeout --signal=TERM --kill-after=30s 900s node node_modules/next/dist/bin/next build --webpack --experimental-build-mode compile
          timeout --signal=TERM --kill-after=30s 900s node node_modules/next/dist/bin/next build --webpack --experimental-build-mode generate
          app_output_dir="$PWD/.next/server/app"
          test -d "$app_output_dir"
          mkdir -p out
          while IFS= read -r -d '' html_file; do
            relative_path="${html_file#"$app_output_dir/"}"
            destination="$PWD/out/$relative_path"
            mkdir -p "$(dirname "$destination")"
            cp "$html_file" "$destination"
          done < <(find "$app_output_dir" -type f -name '*.html' -print0)
          test -s out/index.html
          test -d out/_next
          test "$(find out -type f -name '*.html' | wc -l)" -gt 0

      - name: Build backend
        shell: bash
        working-directory: ${{ steps.source.outputs.path }}/backend
        env:
          CGO_ENABLED: '1'
          GOMAXPROCS: '2'
        run: |
          set -Eeuo pipefail
          make build
          test -x ../.cache/deeix-chat/deeix-chat

      - name: Package and verify
        id: package
        shell: bash
        env:
          SOURCE_DIR: ${{ steps.source.outputs.path }}
          VERSION: ${{ steps.metadata.outputs.version }}
          COMMIT: ${{ steps.metadata.outputs.commit }}
        run: |
          set -Eeuo pipefail
          releases="$RUNNER_TEMP/deeix-chat-releases"
          bundle="deeix-chat-${VERSION}-linux-amd64"
          stage="$releases/$bundle"
          archive="$releases/$bundle.tar.gz"
          rm -rf "$releases"
          mkdir -p "$stage/backend" "$stage/frontend/out"
          cp "$SOURCE_DIR/.cache/deeix-chat/deeix-chat" "$stage/backend/deeix-chat"
          cp -a "$SOURCE_DIR/apps/web/out/." "$stage/frontend/out/"
          cp "$SOURCE_DIR/config.sqlite.example.yaml" "$stage/config.sqlite.example.yaml"
          cp "$SOURCE_DIR/LICENSE" "$stage/LICENSE"
          cp "$SOURCE_DIR/NOTICE" "$stage/NOTICE"
          chmod 0755 "$stage/backend/deeix-chat"
          cat > "$stage/README.md" <<DOC
          # DEEIX Chat ${VERSION} production bundle

          Source commit: ${COMMIT}
          Target: Linux x86_64

          Directory layout:
              backend/deeix-chat
              frontend/out/index.html and other frontend production files

          Before starting, copy config.sqlite.example.yaml to config.yaml, set production secrets,
          set server.frontend_dist_dir to ./frontend/out, create data and storage directories,
          then run ./backend/deeix-chat.
          DOC
          tar -C "$stage" --sort=name --mtime='UTC 2026-01-01' --owner=0 --group=0 --numeric-owner --mode='u+rwX,go+rX,go-w' -czf "$archive" backend frontend config.sqlite.example.yaml LICENSE NOTICE README.md
          tar -tzf "$archive" > "$releases/archive.contents"
          grep -qE '^backend/$' "$releases/archive.contents"
          grep -qE '^backend/deeix-chat$' "$releases/archive.contents"
          grep -qE '^frontend/out/$' "$releases/archive.contents"
          grep -qE '^frontend/out/index.html$' "$releases/archive.contents"
          if grep -qE "^${bundle}/" "$releases/archive.contents"; then
            echo 'Archive contains an unexpected enclosing root directory' >&2
            exit 1
          fi
          extract_dir=$(mktemp -d)
          trap 'rm -rf "$extract_dir"' EXIT
          tar -xzf "$archive" -C "$extract_dir"
          test -x "$extract_dir/backend/deeix-chat"
          test -s "$extract_dir/frontend/out/index.html"
          sha256=$(sha256sum "$archive" | awk '{print $1}')
          printf '%s  %s\n' "$sha256" "$(basename "$archive")" > "$releases/$bundle.sha256"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "archive_name=$(basename "$archive")" >> "$GITHUB_OUTPUT"
          echo "checksum=$releases/$bundle.sha256" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Upload tarball to GitHub Release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.metadata.outputs.version }}
          COMMIT: ${{ steps.metadata.outputs.commit }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          ARCHIVE_NAME: ${{ steps.package.outputs.archive_name }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          set -Eeuo pipefail
          release_tag="${RELEASE_TAG_INPUT:-v${VERSION}}"
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$release_tag" "$ARCHIVE" "$CHECKSUM" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$release_tag" "$ARCHIVE" "$CHECKSUM" \
              --repo "$GITHUB_REPOSITORY" \
              --title "DEEIX Chat ${VERSION}" \
              --notes "Built from source commit ${COMMIT}. The archive contains backend/deeix-chat and frontend/out/index.html."
          fi
          release_url="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${release_tag}"
          download_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${release_tag}/${ARCHIVE_NAME}"
          echo "release_url=$release_url" >> "$GITHUB_OUTPUT"
          echo "download_url=$download_url" >> "$GITHUB_OUTPUT"

      - name: Write summary
        shell: bash
        run: |
          {
            echo "## DEEIX Chat bundle"
            echo
            echo "- Version: ${{ steps.metadata.outputs.version }}"
            echo "- Commit: ${{ steps.metadata.outputs.commit }}"
            echo "- Release: ${{ steps.release.outputs.release_url }}"
            echo "- Download: ${{ steps.release.outputs.download_url }}"
            echo "- Archive: ${{ steps.package.outputs.archive_name }}"
            echo "- SHA-256: ${{ steps.package.outputs.sha256 }}"
            echo "- Frontend entry: frontend/out/index.html"
          } >> "$GITHUB_STEP_SUMMARY"
